<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1 Million Checkboxes</title>

    <style>
        body {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>
    <h1>Checkboxes</h1>
    <div id='container'></div>

    <script src="/socket.io/socket.io.js"></script>

    <script>
        const socket = io();
        const container = document.getElementById("container");
        const CHECKBOX_COUNT = 100;

        socket.on('server:checkbox:change', data => {
            console.log('socket server Event', data)
            const { index, checked } = data

            const input = document.getElementById(`checbox-${index}`);

            if (input) {
                input.checked = checked;
            }

        })

        window.addEventListener('load', async () => {
            const response = await fetch('/checkboxes', { method: 'GET' })
            const data = await response.json();

            if (data && data.checkboxes) {
                data.checkboxes.forEach((serverValue, index) => {

                    const input = document.createElement("input");

                    input.type = "checkbox";
                    input.id = `checbox-${index}`
                    input.checked = serverValue

                    input.addEventListener('change', (event) => {
                        const checked = event.target.checked;
                        console.log('checkbox changed', { index, checked });
                        socket.emit('client:checkbox:change', { index, checked });

                    });

                    container.appendChild(input);

                });
            }
        })

    </script>
</body>

</html>
